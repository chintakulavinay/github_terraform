name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  destroy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Set Environment
        run: |
          if [ "${{ github.event.inputs.environment }}" = "dev" ]; then
            echo "TFVARS=tfvars/dev.tfvars" >> $GITHUB_ENV
            echo "STATE_KEY=dev/terraform.tfstate" >> $GITHUB_ENV

          elif [ "${{ github.event.inputs.environment }}" = "qa" ]; then
            echo "TFVARS=tfvars/qa.tfvars" >> $GITHUB_ENV
            echo "STATE_KEY=qa/terraform.tfstate" >> $GITHUB_ENV

          else
            echo "TFVARS=tfvars/prod.tfvars" >> $GITHUB_ENV
            echo "STATE_KEY=prod/terraform.tfstate" >> $GITHUB_ENV
          fi

      - name: Terraform Init
        run: |
          terraform init -reconfigure \
            -backend-config="bucket=githubactions-897826" \
            -backend-config="key=${STATE_KEY}" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=terraform-locks"

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -var-file="$TFVARS"
